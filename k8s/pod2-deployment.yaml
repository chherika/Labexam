apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod2-update
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod2
  template:
    metadata:
      labels:
        app: pod2
    spec:
      containers:
        - name: update-service
          image: update-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017/studentdb"