apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod1-gateway-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod1
  template:
    metadata:
      labels:
        app: pod1
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: REGISTRATION_URL
              value: "http://127.0.0.1:3001"
            - name: UPDATE_URL
              value: "http://update-service:3002"
        - name: registration
          image: registration:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017/studentdb"